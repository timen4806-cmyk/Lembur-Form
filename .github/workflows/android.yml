name: Android CI Build & APK Export

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK (Debug & Release)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Environment Files (.env)
        run: |
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
              echo "Created .env from .env.example"
            else
              touch .env
              echo "Created empty .env"
            fi
          fi

      - name: Setup Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            echo "Decoding debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          else
            echo "Generating new debug.keystore via keytool..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Setup Release Keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Decoding release keystore from GitHub Secret..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
          elif [ -f my-upload-key.base64 ]; then
            echo "Decoding release keystore from repository my-upload-key.base64..."
            base64 -d my-upload-key.base64 > my-upload-key.jks
          else
            echo "Generating fallback upload keystore for CI..."
            keytool -genkey -v -keystore my-upload-key.jks -storepass "${{ secrets.STORE_PASSWORD || 'android' }}" -alias "${{ secrets.KEY_ALIAS || 'upload' }}" -keypass "${{ secrets.KEY_PASSWORD || 'android' }}" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Form Lembur SPKL,OU=Engineering,O=Perusahaan,L=Jakarta,ST=Jakarta,C=ID"
          fi
          cp my-upload-key.jks app/my-upload-key.jks

      - name: Generate Gradle Wrapper if Missing
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper
            chmod +x gradlew
          else
            chmod +x gradlew
          fi

      - name: Build Debug & Release APK
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
          GRADLE_OPTS: "-Djava.awt.headless=true -Dkotlin.compiler.execution.strategy=daemon"
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'upload' }}
        run: |
          ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Copy APK to Root for Direct Export
        run: |
          mkdir -p apks
          cp app/build/outputs/apk/release/*.apk apks/app-release.apk
          cp app/build/outputs/apk/debug/*.apk apks/app-debug.apk
          echo "### 📱 Hasil Kompilasi APK Siap Diunduh:" >> $GITHUB_STEP_SUMMARY
          echo "- **Release APK:** \`app-release.apk\` (Bisa diunduh dari menu Artifacts atau Releases)" >> $GITHUB_STEP_SUMMARY
          echo "- **Debug APK:** \`app-debug.apk\`" >> $GITHUB_STEP_SUMMARY

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: apks/app-debug.apk
          retention-days: 30

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: apks/app-release.apk
          retention-days: 30

      - name: Publish Direct APK Download to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: "v1.0.0-build${{ github.run_number }}"
          name: "Form Lembur SPKL - Build #${{ github.run_number }}"
          body: |
            ## 📥 Unduh File APK Langsung:
            Klik tautan berkas di bawah ini untuk langsung mengunduh ke ponsel Android Anda:
            - **[Unduh app-release.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.0-build${{ github.run_number }}/app-release.apk)** (Rekomendasi untuk dipasang di HP)
            - **[Unduh app-debug.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.0-build${{ github.run_number }}/app-debug.apk)**
          draft: false
          prerelease: false
          files: |
            apks/app-release.apk
            apks/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
